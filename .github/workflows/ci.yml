name: CI (tests only - uv)

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv & deps
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --extra dev || uv sync

      - name: Run tests
        run: pytest -q

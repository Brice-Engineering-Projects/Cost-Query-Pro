name: CI (uv tests only)

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bootstrap uv
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      # Install your deps (dev group if present)
      - name: Sync dependencies
        run: uv sync --extra dev || uv sync

      # Optional: quick debug so we can see what's installed
      - name: Debug env
        run: |
          uv run python -V
          uv run python -c "import pytest; print('pytest', pytest.__version__)"
          uv run which pytest

      # Run tests inside uv env; disable stray plugins on the runner
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run pytest -q

name: CI (uv + Postgres tests)

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cqp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TESTING: "1"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cqp_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cqp_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"


      # 🔐 auth/test defaults (adjust names to match your Pydantic settings)
      SECRET_KEY: "not-a-real-secret-in-ci"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      ALGORITHM: "HS256"

      # 📨 if your settings try to load email/SMS providers, neutralize them:
      SENDGRID_API_KEY: ""
      EMAIL_FROM: "noreply@example.com"
      SMTP_HOST: ""
      SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync dependencies
        run: uv sync --extra dev || uv sync

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=src" >> $GITHUB_ENV

      # If you have Alembic, uncomment this to create tables:
      - name: Run migrations
        run: uv run alembic upgrade head

      # If no Alembic yet, quickly create tables for tests (adjust import paths if needed):
      - name: Create tables (no Alembic)
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine
          # Update these to your actual metadata import:
          # e.g., from src.app.db.base import Base
          from src.cost_query_pro.db import Base  
          url = os.environ["DATABASE_URL"]
          engine = create_engine(url, future=True)
          Base.metadata.create_all(bind=engine)
          PY

      - name: Run tests
        run: uv run pytest -q

name: CI (uv + Postgres tests)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security:
    name: Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --dev --frozen

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      # Strictness comes from [tool.mypy] in pyproject.toml (strict = true),
      # so this matches what a local `uv run mypy` does. src/cost_query_pro
      # is the gate that must not regress; tests/ is checked at a relaxed
      # level via the [[tool.mypy.overrides]] entry.
      - name: Run mypy (static type checking)
        run: uv run mypy --strict src/cost_query_pro

      - name: Run Bandit (production code)
        run: uv run bandit -r src -c pyproject.toml

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-security
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cqp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TESTING: "1"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cqp_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cqp_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

      # 🔐 auth/test defaults (adjust names to match your Pydantic settings)
      SECRET_KEY: "not-a-real-secret-in-ci-32-bytes-min"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      ALGORITHM: "HS256"

      # 📨 if your settings try to load email/SMS providers, neutralize them:
      SENDGRID_API_KEY: ""
      EMAIL_FROM: "noreply@example.com"
      SMTP_HOST: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --dev --frozen

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=src" >> $GITHUB_ENV

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -q

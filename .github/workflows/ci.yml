name: CI (uv tests only)

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bootstrap uv (safe to use pip here)
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      # install your project deps (dev group if present)
      - name: Sync dependencies
        run: uv sync --extra dev || uv sync

      # run tests inside uv's venv
      - name: Run tests
        run: uv run pytest -q

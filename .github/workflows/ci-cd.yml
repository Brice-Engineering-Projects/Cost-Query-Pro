# .github/workflows/ci-cd.yml

name: CI/CD (Conda | uv | pip) + Lint + Security + Vercel

on:
  push:
    branches: [ main, dev, develop, feature/**, feat/** ]
  pull_request:
    branches: [ main, dev, develop ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------
# LINT JOB: Black (check) + Flake8
# ------------------------------
jobs:
  lint:
    name: Lint (Black + Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Black (check mode)
        run: black --check .

      - name: Flake8
        run: flake8 .

# ------------------------------
# SECURITY JOB: Bandit + pip-audit
# ------------------------------
  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sec-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-sec-

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit (SAST on Python code)
        run: bandit -r . -q -x tests

      - name: Dependency audit (pip-audit)
        # Fails build on known vulnerable deps. You can add '--ignore-vuln' if needed.
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            pip-audit
          else
            echo "No dependency manifest found; skipping pip-audit."
          fi

# ------------------------------
# CI JOB: Env-aware install + tests
# ------------------------------
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [lint, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager files
        id: detect
        run: |
          echo "has_env_yml=${{ hashFiles('environment.yml') != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_pyproject=${{ hashFiles('pyproject.toml') != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_requirements=${{ hashFiles('requirements.txt') != '' }}" >> "$GITHUB_OUTPUT"
          if [[ -n "${{ hashFiles('pytest.ini', 'pyproject.toml') }}" || -n "${{ hashFiles('**/test_*.py') }}" ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.detect.outputs.has_env_yml == 'true' || steps.detect.outputs.has_pyproject == 'true' || steps.detect.outputs.has_requirements == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Conda path
      - name: Set up Conda (environment.yml)
        if: ${{ steps.detect.outputs.has_env_yml == 'true' }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: ci-env
          auto-activate-base: false
          miniforge-version: latest

      # uv path
      - name: Install with uv (pyproject.toml)
        if: ${{ steps.detect.outputs.has_env_yml != 'true' && steps.detect.outputs.has_pyproject == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install uv
          if [ -f "pyproject.toml" ]; then
            uv sync
          fi
          if [ -f "requirements.txt" ]; then
            uv pip install -r requirements.txt
          fi

      # pip path
      - name: Install with pip (requirements.txt)
        if: ${{ steps.detect.outputs.has_env_yml != 'true' && steps.detect.outputs.has_pyproject != 'true' && steps.detect.outputs.has_requirements == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (pytest if present)
        if: ${{ steps.detect.outputs.has_tests == 'true' }}
        run: pytest -q

# ------------------------------
# DEPLOY JOB: Vercel (Preview on PR, Prod on main)
# ------------------------------
  deploy:
    name: Deploy to Vercel (Preview PR / Prod main)
    runs-on: ubuntu-latest
    needs: [lint, security, ci]
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment environment
        id: env
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "vercel_env=production" >> "$GITHUB_OUTPUT"
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js (for Vercel CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Configure Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=${{ steps.env.outputs.vercel_env }} --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ steps.env.outputs.is_prod }}" = "true" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy (prebuilt output)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ steps.env.outputs.is_prod }}" = "true" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Output Deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

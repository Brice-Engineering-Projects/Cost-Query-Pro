# .github/workflows/ci-cd.yml

name: CI/CD

# --------------------------
# Commented out until more established
# --------------------------

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

#on:
#  workflow_dispatch: {}

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------
# LINT JOB: Black (check) + Flake8
# ------------------------------
jobs:
  lint:
    name: Lint (Black + Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Black (check mode)
        run: black --check .

      - name: Flake8
        run: flake8 .

  # ------------------------------
  # SECURITY JOB: Bandit + pip-audit
  # ------------------------------
  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sec-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-sec-

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit (SAST on Python code)
        run: bandit -r . -q -x tests

      - name: Dependency audit (pip-audit)
        # Fails build on known vulnerable deps unless explicitly ignored
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt \
              --ignore-vuln GHSA-wj6h-64fc-37mp \
              --ignore-vuln GHSA-wf5f-4jwr-ppcp \
              --ignore-vuln GHSA-f83h-ghpp-7wcc \
              --ignore-vuln GHSA-2c2j-9gv5-cj73 \
              --ignore-vuln GHSA-7f5h-v6xp-fcq8
          elif [ -f "pyproject.toml" ]; then
            pip-audit \
              --ignore-vuln GHSA-wj6h-64fc-37mp \
              --ignore-vuln GHSA-wf5f-4jwr-ppcp \
              --ignore-vuln GHSA-f83h-ghpp-7wcc \
              --ignore-vuln GHSA-2c2j-9gv5-cj73 \
              --ignore-vuln GHSA-7f5h-v6xp-fcq8
          else
            echo "No dependency manifest found; skipping pip-audit."
          fi

  # ------------------------------
  # CI JOB: Env-aware install + tests
  # ------------------------------
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [ lint, security ]

    # -----------------------------------
    # TEST DATABASE SERVICE (PostgreSQL)
    # -----------------------------------
    # Senior Dev Notes:
    # - This containerized Postgres instance is used only for pytest.
    # - TEST_DATABASE_URL below points to this service.
    # - Alembic migrations run via conftest before tests execute.
    # - Health checks ensure DB is ready before pytest begins.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager files
        id: detect
        run: |
          echo "has_env_yml=${{ hashFiles('environment.yml') != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_pyproject=${{ hashFiles('pyproject.toml') != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_requirements=${{ hashFiles('requirements.txt') != '' }}" >> "$GITHUB_OUTPUT"
          if [[ -n "${{ hashFiles('pytest.ini', 'pyproject.toml') }}" || -n "${{ hashFiles('**/test_*.py') }}" ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.detect.outputs.has_env_yml == 'true' || steps.detect.outputs.has_pyproject == 'true' || steps.detect.outputs.has_requirements == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Conda path
      - name: Set up Conda (environment.yml)
        if: ${{ steps.detect.outputs.has_env_yml == 'true' }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: ci-env
          auto-activate-base: false
          miniforge-version: latest

      # uv path
      - name: Install with uv (pyproject.toml)
        if: ${{ steps.detect.outputs.has_env_yml != 'true' && steps.detect.outputs.has_pyproject == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install uv
          if [ -f "pyproject.toml" ]; then
            uv sync
          fi
          if [ -f "requirements.txt" ]; then
            uv pip install -r requirements.txt
          fi

      # pip path
      - name: Install with pip (requirements.txt)
        if: ${{ steps.detect.outputs.has_env_yml != 'true' && steps.detect.outputs.has_pyproject != 'true' && steps.detect.outputs.has_requirements == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pre-Commit Checks
        run: uv run pre-commit run --all-files

      - name: Run tests (pytest if present)
        if: ${{ steps.detect.outputs.has_tests == 'true' }}
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_db
        run: TEST_DATABASE_URL=$TEST_DATABASE_URL uv run pytest -q





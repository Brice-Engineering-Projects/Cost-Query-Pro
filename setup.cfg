# ============================
# Cost Query Pro — setup.cfg
# Central configuration for linters, formatters, tests, and coverage
# ============================

[flake8]
# Max line length increased for modern standards
max-line-length = 150

# Exclude auto-generated and irrelevant directories
exclude =
    migrations,
    migrations_old,
    __pycache__,
    .venv,
    venv,
    build,
    dist

# Ignore import-at-top errors in env.py (handled manually)
per-file-ignores =
    migrations/env.py:E402
    migrations_old/env.py:E402
    tests/conftest.py:E402
    tests/unit_tests/test_auth_jwt.py:F841



# ============================
# isort (import sorter)
# ============================
[isort]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = true


# ============================
# pytest configuration
# ============================
[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --disable-warnings
    --maxfail=1


# ============================
# Coverage configuration
# ============================
[coverage:run]
omit =
    migrations/*
    migrations_old/*
    tests/*
    __pycache__/*
    venv/*
    .venv/*


[coverage:report]
skip_covered = true
show_missing = true


# ============================
# MyPy
# ============================
# Configured in pyproject.toml under [tool.mypy], NOT here.
#
# mypy resolves config in this order: mypy.ini, .mypy.ini, pyproject.toml,
# setup.cfg — and stops at the first file it finds. Since this project has a
# pyproject.toml with a [tool.mypy] section, a [mypy] section in this file is
# read by nothing. It previously carried settings that looked active but had
# no effect; they now live in pyproject.toml where mypy actually reads them.

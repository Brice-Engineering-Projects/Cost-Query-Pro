[project]
name = "cost-query-pro"
version = "0.1.0"
description = "A Python application for searching, managing, and analyzing unit cost data from infrastructure projects."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Brice", email = "brice@devbybrice.com" }
]

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "python-multipart==0.0.22",
    "psycopg2-binary>=2.9",
    "jinja2>=3.1",
    "pdfplumber>=0.10",
    "tabulate>=0.9",
    "httpx>=0.28.1",
    "redis>=6.2.0",
    "alembic>=1.16.4",
    "pydantic-settings>=2.10.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "certifi>=2025.7.9",
    "starlette>=0.49.1",
    "bcrypt>=4.1.2",
    "pdfminer-six==20250506",  # until fixed upstream
    "pypdfium2!=4.30.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "isort>=5.12",
    "mypy>=1.9"
]

[project.urls]
Homepage = "https://www.devbybrice.com"
Blog = "https://medium.com/@quantshift"
Repository = "https://github.com/Brice-Engineering-Projects/Cost-Query-Pro"

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "bandit>=1.8.6",
    "black>=25.1.0",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "mypy>=1.16.1",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "ruff>=0.14.3",
    "yamllint>=1.37.1",
]

[tool.uv.sources]
cost-query-pro = { path = "src" }

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "(^migrations_old/|^migrations/)"
# --- temporary relaxations ---
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false
follow_imports = "silent"
allow_subclassing_any = true
allow_untyped_globals = true
allow_redefinition = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "migrations_old", "migrations"]
skips = ["B101", "B105", "B106", "B110"]
